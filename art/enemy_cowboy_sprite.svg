<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <!-- ===================== ENEMY COWBOY - IDLE POSE ===================== -->
  <!-- Transparent background, flat-shaded pixel-ish style, front-facing -->

  <!-- Shadow -->
  <ellipse cx="128" cy="304" rx="46" ry="10" fill="#000000" opacity="0.25"/>

  <!-- Legs / boots -->
  <rect x="98" y="230" width="24" height="60" fill="#2b2320"/>
  <rect x="134" y="230" width="24" height="60" fill="#2b2320"/>
  <rect x="90" y="278" width="40" height="18" rx="3" fill="#1a1512"/>
  <rect x="126" y="278" width="40" height="18" rx="3" fill="#1a1512"/>
  <rect x="90" y="278" width="40" height="6" fill="#4a3a2a"/>
  <rect x="126" y="278" width="40" height="6" fill="#4a3a2a"/>

  <!-- Belt -->
  <rect x="92" y="216" width="72" height="16" fill="#3b2a1a"/>
  <rect x="118" y="218" width="20" height="12" fill="#c9a227"/>

  <!-- Torso / poncho -->
  <path d="M84 150 
           L172 150 
           L182 224 
           L74 224 Z" fill="#6b4a2b"/>
  <path d="M84 150 L172 150 L178 170 L78 170 Z" fill="#7d5a35"/>
  <!-- poncho stripe -->
  <rect x="80" y="190" width="96" height="10" fill="#8f2f2f"/>
  <rect x="80" y="205" width="96" height="6" fill="#c9a227"/>

  <!-- Gun belt holster + gun -->
  <rect x="150" y="222" width="26" height="34" rx="4" fill="#3b2a1a"/>
  <rect x="154" y="196" width="18" height="34" rx="3" fill="#4a4a4a"/>
  <rect x="150" y="200" width="26" height="8" rx="2" fill="#2c2c2c"/>

  <!-- Left arm -->
  <rect x="60" y="158" width="24" height="60" rx="8" fill="#6b4a2b"/>
  <circle cx="72" cy="222" r="12" fill="#c98d5a"/>

  <!-- Right arm (resting near gun) -->
  <rect x="172" y="158" width="24" height="56" rx="8" fill="#6b4a2b"/>
  <circle cx="184" cy="216" r="12" fill="#c98d5a"/>

  <!-- Neck -->
  <rect x="116" y="132" width="24" height="20" fill="#c98d5a"/>

  <!-- Head -->
  <circle cx="128" cy="104" r="38" fill="#c98d5a"/>

  <!-- Bandana mask over lower face -->
  <path d="M92 104 Q128 148 164 104 L164 118 Q128 154 92 118 Z" fill="#8f2f2f"/>
  <path d="M92 104 Q128 148 164 104" stroke="#6e2222" stroke-width="3" fill="none"/>

  <!-- Eyes (narrowed, villain look) -->
  <path d="M104 96 L118 100" stroke="#241a12" stroke-width="4" stroke-linecap="round"/>
  <path d="M152 96 L138 100" stroke="#241a12" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M100 88 L120 92" stroke="#2b2016" stroke-width="4" stroke-linecap="round"/>
  <path d="M156 88 L136 92" stroke="#2b2016" stroke-width="4" stroke-linecap="round"/>

  <!-- Hat brim -->
  <ellipse cx="128" cy="78" rx="58" ry="16" fill="#241a12"/>
  <!-- Hat crown -->
  <path d="M100 78 Q100 32 128 30 Q156 32 156 78 Z" fill="#2f2418"/>
  <rect x="100" y="66" width="56" height="10" fill="#5a1f1f"/>

  <!-- Hat brim highlight -->
  <ellipse cx="128" cy="76" rx="58" ry="16" fill="none" stroke="#000000" stroke-width="2" opacity="0.4"/>

</svg>
